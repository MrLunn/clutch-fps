name: Acquire Unity Activation File

# Run this ONCE, manually (Actions tab -> this workflow -> Run workflow), to get
# the .alf file needed to activate a free Unity Personal license in CI.
# See BUILD.md for the full step-by-step.
on: workflow_dispatch

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request .alf
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.20f1

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
