name: Build & Release

# Cloud build via GameCI. Disabled by default (manual-only) because it needs a
# Unity license configured in CI (UNITY_LICENSE secret) — see BUILD.md. The
# day-to-day path is local: run ./publish.ps1, which builds with your licensed
# editor and republishes the "latest" release. Re-enable the push trigger here
# once the license secrets are set if you want fully-automatic cloud builds.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (StandaloneWindows64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the imported Library so subsequent builds are much faster.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.20f1
          targetPlatform: StandaloneWindows64
          buildName: ClutchFPS

      - name: Zip build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../ClutchFPS-Windows.zip .

      - name: Publish rolling "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: |
            Automatic build from the newest commit on `main`.

            1. Download **ClutchFPS-Windows.zip** below.
            2. Unzip the whole folder (not just the .exe).
            3. Run **ClutchFPS.exe**. Windows may warn about an unsigned app —
               click *More info -> Run anyway*.
          artifacts: ClutchFPS-Windows.zip
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
